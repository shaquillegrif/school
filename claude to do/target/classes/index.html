<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e0f;
      --surface: #17171a;
      --border: #2a2a2e;
      --accent: #c8f04a;
      --accent-dim: #a8cc35;
      --text: #f0f0ee;
      --muted: #6b6b72;
      --danger: #ff5f5f;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px;
    }

    header {
      width: 100%;
      max-width: 680px;
      margin-bottom: 48px;
      animation: fadeDown 0.5s ease both;
    }

    header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
    }

    header h1 span {
      color: var(--accent);
    }

    header p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      max-width: 680px;
      margin-bottom: 16px;
      animation: fadeUp 0.4s ease both;
    }

    .form-card { animation-delay: 0.1s; }
    .list-card { animation-delay: 0.2s; padding: 0; overflow: hidden; }

    .form-row {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input, textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.9rem;
      padding: 12px 16px;
      width: 100%;
      transition: border-color 0.2s;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
    }

    textarea { resize: vertical; min-height: 72px; }

    button {
      cursor: pointer;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 0.9rem;
      transition: all 0.15s;
    }

    .btn-primary {
      background: var(--accent);
      color: #0e0e0f;
      width: 100%;
    }

    .btn-primary:hover { background: var(--accent-dim); transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }

    /* Filter tabs */
    .filters {
      display: flex;
      gap: 8px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
    }

    .filter-btn {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 14px;
      font-size: 0.78rem;
      font-family: 'DM Mono', monospace;
      font-weight: 400;
      border-radius: 100px;
    }

    .filter-btn.active {
      background: var(--accent);
      color: #0e0e0f;
      border-color: var(--accent);
      font-weight: 500;
    }

    .filter-btn:hover:not(.active) {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Todo items */
    .todo-list { list-style: none; }

    .todo-item {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
      animation: fadeUp 0.3s ease both;
    }

    .todo-item:last-child { border-bottom: none; }
    .todo-item:hover { background: rgba(255,255,255,0.02); }

    .todo-check {
      width: 22px;
      height: 22px;
      border: 2px solid var(--border);
      border-radius: 6px;
      flex-shrink: 0;
      cursor: pointer;
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .todo-check.done {
      background: var(--accent);
      border-color: var(--accent);
    }

    .todo-check.done::after {
      content: '✓';
      color: #0e0e0f;
      font-size: 13px;
      font-weight: bold;
    }

    .todo-check:hover:not(.done) {
      border-color: var(--accent);
    }

    .todo-body { flex: 1; min-width: 0; }

    .todo-title {
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      word-break: break-word;
      transition: color 0.2s;
    }

    .todo-item.completed .todo-title {
      color: var(--muted);
      text-decoration: line-through;
    }

    .todo-desc {
      margin-top: 4px;
      font-size: 0.8rem;
      color: var(--muted);
      word-break: break-word;
    }

    .todo-meta {
      margin-top: 6px;
      font-size: 0.72rem;
      color: #444;
    }

    .todo-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 8px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-icon:hover { border-color: var(--danger); color: var(--danger); }

    /* Empty state */
    .empty {
      padding: 48px 24px;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .empty span { font-size: 2rem; display: block; margin-bottom: 12px; }

    /* Stats */
    .stats {
      display: flex;
      gap: 24px;
      padding: 12px 24px;
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--muted);
    }

    .stats b { color: var(--accent); }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      width: 100%;
      max-width: 480px;
      margin: 16px;
    }

    .modal h2 {
      font-family: 'Syne', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      flex: 1;
    }

    .btn-secondary:hover { border-color: var(--muted); }
    .btn-primary.flex-1 { flex: 1; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 0.82rem;
      color: var(--text);
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 200;
    }

    .toast.show { transform: translateY(0); opacity: 1; }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<header>
  <h1>todo<span>.</span></h1>
  <p>Jouw taken, overzichtelijk bijgehouden.</p>
</header>

<!-- Nieuwe todo form -->
<div class="card form-card">
  <div class="form-row">
    <input id="titleInput" type="text" placeholder="Wat moet je doen?" />
    <textarea id="descInput" placeholder="Beschrijving (optioneel)"></textarea>
    <button class="btn-primary" onclick="createTodo()">+ Toevoegen</button>
  </div>
</div>

<!-- Todo lijst -->
<div class="card list-card">
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all', this)">Alles</button>
    <button class="filter-btn" onclick="setFilter('open', this)">Open</button>
    <button class="filter-btn" onclick="setFilter('done', this)">Gedaan</button>
  </div>
  <ul class="todo-list" id="todoList"></ul>
  <div class="stats" id="stats"></div>
</div>

<!-- Edit modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h2>Todo bewerken</h2>
    <div class="form-row">
      <input id="editTitle" type="text" placeholder="Titel" />
      <textarea id="editDesc" placeholder="Beschrijving"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Annuleren</button>
      <button class="btn-primary flex-1" onclick="saveEdit()">Opslaan</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  const API = '/api/todos';
  let todos = [];
  let filter = 'all';
  let editingId = null;

  async function loadTodos() {
    try {
      const res = await fetch(API);
      todos = await res.json();
      render();
    } catch (e) {
      showToast('Fout bij laden van todos');
    }
  }

  async function createTodo() {
    const title = document.getElementById('titleInput').value.trim();
    const description = document.getElementById('descInput').value.trim();
    if (!title) { showToast('Vul een titel in'); return; }

    await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, description })
    });

    document.getElementById('titleInput').value = '';
    document.getElementById('descInput').value = '';
    showToast('Todo toegevoegd ✓');
    loadTodos();
  }

  async function toggleTodo(id) {
    const todo = todos.find(t => t.id === id);
    await fetch(`${API}/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...todo, completed: !todo.completed })
    });
    loadTodos();
  }

  async function deleteTodo(id) {
    await fetch(`${API}/${id}`, { method: 'DELETE' });
    showToast('Todo verwijderd');
    loadTodos();
  }

  function openEdit(id) {
    const todo = todos.find(t => t.id === id);
    editingId = id;
    document.getElementById('editTitle').value = todo.title;
    document.getElementById('editDesc').value = todo.description || '';
    document.getElementById('editModal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('editModal').classList.remove('open');
    editingId = null;
  }

  async function saveEdit() {
    const todo = todos.find(t => t.id === editingId);
    const title = document.getElementById('editTitle').value.trim();
    const description = document.getElementById('editDesc').value.trim();
    if (!title) { showToast('Vul een titel in'); return; }

    await fetch(`${API}/${editingId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...todo, title, description })
    });

    closeModal();
    showToast('Todo bijgewerkt ✓');
    loadTodos();
  }

  function setFilter(f, btn) {
    filter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function render() {
    const list = document.getElementById('todoList');
    const filtered = todos.filter(t => {
      if (filter === 'open') return !t.completed;
      if (filter === 'done') return t.completed;
      return true;
    });

    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty"><span>📋</span>Geen todos gevonden.</div>`;
    } else {
      list.innerHTML = filtered.map(t => `
        <li class="todo-item ${t.completed ? 'completed' : ''}">
          <div class="todo-check ${t.completed ? 'done' : ''}" onclick="toggleTodo(${t.id})"></div>
          <div class="todo-body">
            <div class="todo-title">${escHtml(t.title)}</div>
            ${t.description ? `<div class="todo-desc">${escHtml(t.description)}</div>` : ''}
            <div class="todo-meta">${formatDate(t.createdAt)}</div>
          </div>
          <div class="todo-actions">
            <button class="btn-icon" onclick="openEdit(${t.id})" title="Bewerken">✎</button>
            <button class="btn-icon" onclick="deleteTodo(${t.id})" title="Verwijderen">✕</button>
          </div>
        </li>
      `).join('');
    }

    const done = todos.filter(t => t.completed).length;
    document.getElementById('stats').innerHTML =
      `<span><b>${todos.length}</b> totaal</span>
       <span><b>${todos.length - done}</b> open</span>
       <span><b>${done}</b> gedaan</span>`;
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatDate(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
  }

  // Enter om toe te voegen
  document.getElementById('titleInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') createTodo();
  });

  // Sluit modal bij klik buiten
  document.getElementById('editModal').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeModal();
  });

  loadTodos();
</script>
</body>
</html>
