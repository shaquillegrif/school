<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<div>
    <img src="/files/logo.png" alt="">
</div>

<div class="topnav">
    <input type="text" placeholder="Search..">
    <div class="nav-item active" data-tab="Home"><span class="emoji">🏠</span>Home</div>
    <div class="nav-item" data-tab="Vrienden"><span class="emoji">👥</span>Vrienden</div>
    <div class="nav-item" data-tab="Foto's"><span class="emoji">🖼️</span>Foto's</div>
    <div class="nav-item" data-tab="Groepen"><span class="emoji">⭐</span>Groepen</div>
    <div class="nav-item" data-tab="Berichten" id="navBerichten"><span class="emoji">✉️</span>Berichten<span class="badge" id="badgeBerichten"></span>
</div>

<div>
    <img src="/files/blank-avatar-placeholder-grey-vector-21806614.png" alt="">
</div>

<form class="post-box">

    <div class="post-header">
        <img src="/files/blank-avatar-placeholder-grey-vector-21806614.png" alt="Profielfoto">

        <textarea
            name="post"
            placeholder="Wat doe jij nu?"
            required
        ></textarea>
    </div>

    <div class="post-actions">
        <button type="button" aria-label="Foto toevoegen">
            📷
        </button>

        <button type="button" aria-label="Emoji toevoegen">
            😊
        </button>

        <button type="button" aria-label="Locatie toevoegen">
            🌐
        </button>

        <button type="submit">
            Plaatsen
        </button>
    </div>

</form>
</body>
</html>
